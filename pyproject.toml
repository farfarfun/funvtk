[build-system]
requires = [ "poetry-core",]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "funvtk"
version = "1.0.10"
description = ""
authors = [ "farfun <1007530194@qq.com>",]
readme = "README.md"
include = ["src/funvtk/py.typed"]
[[tool.poetry.packages]]
from = "src"
